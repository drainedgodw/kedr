name: studio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev xvfb
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release -p kedr-studio
      - name: Capture native UI states
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 scripts/ui_capture.py --binary target/release/kedr-studio
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: studio-native-ui
          path: ui-captures/
      - name: Package Unix preview
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/kedr-studio products/studio.md LICENSE dist/
          rustc --version --verbose > dist/build.txt
          tar -czf kedr-studio-${{ runner.os }}-${{ runner.arch }}.tar.gz -C dist .
      - name: Package Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/kedr-studio.exe, products/studio.md, LICENSE dist
          rustc --version --verbose | Out-File dist/build.txt
          Compress-Archive -Path dist/* -DestinationPath kedr-studio-Windows-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kedr-studio-${{ runner.os }}-${{ runner.arch }}
          path: |
            kedr-studio-*.tar.gz
            kedr-studio-*.zip

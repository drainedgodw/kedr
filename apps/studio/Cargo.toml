[package]
name = "kedr-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
[dependencies]
kedr-core = { path = "../.." }
kedr-workbench = { path = "../../crates/kedr-workbench" }
kedr-ui = { path = "../../crates/kedr-ui" }
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
